name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --passWithNoTests --forceExit
        env:
          NODE_ENV: test
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: test_db
          JWT_SECRET: test-jwt-secret-key-for-ci-testing-only
          JWT_ACCESS_SECRET: test-jwt-access-secret-key-for-ci-testing-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-ci-testing-only

  app-boot-smoke-test:
    name: Full App Boot Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    services:
      postgres:
        image: postgis/postgis:15-3.4

        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Boot full application
        run: npm run ci:app-boot
        env:
          NODE_ENV: test

          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_password
          DATABASE_NAME: test_db

          REDIS_HOST: localhost
          REDIS_PORT: 6379

          TYPEORM_SYNCHRONIZE: 'true'

          JWT_SECRET: test-jwt-secret-key-for-ci-testing-only
          JWT_ACCESS_SECRET: test-jwt-access-secret-key-for-ci-testing-only
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-key-for-ci-testing-only

          # Required at boot by StellarWebhookController.onModuleInit ever since
          # the hardcoded fallback was removed. The application throws and exits
          # if this is unset, so the boot test cannot run without it.
          STELLAR_WEBHOOK_SECRET: test-stellar-webhook-secret-for-ci-testing-only
